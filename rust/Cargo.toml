[package]
name = "wwia"
version = "1.0.0"
edition = "2024"
description = "When Was It Added: shows the Minecraft version that added the block or mob you're looking at"
license = "CC0-1.0"
publish = false

[lib]
crate-type = ["lib"]

[dependencies]
# Attribute macros for JVM bindings, from rustc_codegen_jvm. Needs the
# `mixin-support` branch (method annotations + Mixin-safe classes); cargo-jvm's
# backend must be built from the same branch (see README).
jvm = { package = "rcj", git = "https://github.com/jpdagostin0/rustc_codegen_jvm", branch = "mixin-support" }

[profile.release]
debug = false
